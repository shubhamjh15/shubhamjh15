<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="64" viewBox="0 0 1200 64" fill="none">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a5f3fc"/><stop offset="0.5" stop-color="#c4b5fd"/><stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .line { stroke-dasharray: 900; stroke-dashoffset: 900; animation: draw 2.2s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .dot { animation: pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 50% { transform: scale(1.6); opacity: .5; } }
  </style>
  <text x="0" y="40" font-size="30">🛠️</text>
  <text x="48" y="41" fill="url(#g)" font-size="30" font-weight="800" letter-spacing="-0.5">Tech stack</text>
  <line class="line" x1="0" y1="58" x2="900" y2="58" stroke="url(#l)" stroke-width="2"/>
  <circle class="dot" cx="4" cy="58" r="4" fill="#a5f3fc"/>
</svg>
