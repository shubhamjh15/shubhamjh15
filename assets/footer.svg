  </style>
  <g opacity="0.55" class="wave b"><path d="M0 110 Q150 70 300 110 T600 110 T900 110 T1200 110 T1500 110 T1800 110 V160 H0Z" fill="url(#w2)"/></g>
  <g opacity="0.85" class="wave"><path d="M0 120 Q150 150 300 120 T600 120 T900 120 T1200 120 T1500 120 T1800 120 V160 H0Z" fill="url(#w1)"/></g>
  <text x="600" y="60" fill="#c4b5fd" font-size="20" font-weight="600" text-anchor="middle">Thanks for dropping by — keep shipping ✨</text>
</svg>
